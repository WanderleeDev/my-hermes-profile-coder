name: my-hermes-profile-coder
version: 1.0.0
description: "Hermes profile: coder - development with Agnes AI + GitHub MCP + code review"
author: WanderleeDev
license: MIT
hermes_requires: ">=0.12.0"

env_requires:
  - name: AGNES_API_KEY
    description: "Agnes AI API key for image/video generation"
    required: true
  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key for LLM access"
    required: true
  - name: CLOUDFLARE_API_TOKEN
    description: "Cloudflare API token for Workers, Durable Objects, R2"
    required: true
  - name: R2_ACCESS_KEY_ID
    description: "Cloudflare R2 access key ID for object storage"
    required: false
  - name: R2_SECRET_ACCESS_KEY
    description: "Cloudflare R2 secret access key"
    required: false
  - name: R2_ACCOUNT_ID
    description: "Cloudflare account ID for R2"
    required: false
